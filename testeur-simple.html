<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Testeur API-MARC Simple</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .api-url {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            margin: 15px 0;
        }

        .test-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .platform-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .platform-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .platform-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: #fff;
        }

        .endpoint-group {
            margin-bottom: 15px;
        }

        .endpoint-label {
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #ccc;
        }

        .endpoint-row {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .endpoint-url {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            padding: 8px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #fff;
            word-break: break-all;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-test {
            background: #28a745;
            color: white;
        }

        .btn-test:hover {
            background: #218838;
        }

        .btn-copy {
            background: #007bff;
            color: white;
        }

        .btn-copy:hover {
            background: #0056b3;
        }

        .custom-test {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .custom-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 15px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #ccc;
        }

        .input-group select,
        .input-group input {
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
        }

        .results {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .result-json {
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            color: #90EE90;
            line-height: 1.4;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #28a745;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        @media (max-width: 768px) {
            .custom-inputs {
                grid-template-columns: 1fr;
            }
            
            .endpoint-row {
                flex-direction: column;
            }
            
            .platform-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1> Testeur API-MARC</h1>
            <p>Interface simple pour tester tous les endpoints</p>
            <div class="api-url" id="apiBaseUrl">
                 API: https://web-production-7115f.up.railway.app
            </div>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Vérification...</span>
                <span id="responseTime" style="margin-left: auto;">--ms</span>
            </div>
        </div>

        <!-- Test Personnalisé -->
        <div class="custom-test">
            <h3> Test Personnalisé</h3>
            <div class="custom-inputs">
                <div class="input-group">
                    <label>Plateforme:</label>
                    <select id="customPlatform">
                        <option value="xnxx">XNXX</option>
                        <option value="pornhub">PornHub</option>
                        <option value="xvideos">XVideos</option>
                        <option value="redtube">RedTube</option>
                        <option value="xhamster">XHamster</option>
                        <option value="youporn">YouPorn</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Type:</label>
                    <select id="customType">
                        <option value="random">Random</option>
                        <option value="search">Search</option>
                        <option value="stream">Stream</option>
                        <option value="download">Download</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Paramètre (optionnel):</label>
                    <input type="text" id="customParam" placeholder="ex: amateur, video123...">
                </div>
                <button class="btn btn-test" onclick="testCustom()">
                     Tester
                </button>
            </div>
        </div>

        <!-- Endpoints Rapides -->
        <div class="test-section">
            <h3> Tests Rapides par Plateforme</h3>
            <div class="platform-grid" id="platformGrid">
                <!-- Généré par JavaScript -->
            </div>
        </div>

        <!-- Résultats -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Test en cours...</p>
        </div>

        <div class="results" id="results" style="display: none;">
            <pre class="result-json" id="resultJson"></pre>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
        const API_BASE = "https://web-production-7115f.up.railway.app";
        
        const platforms = [
            { name: "XNXX", id: "xnxx" },
            { name: "PornHub", id: "pornhub" },
            { name: "XVideos", id: "xvideos" },
            { name: "RedTube", id: "redtube" },
            { name: "XHamster", id: "xhamster" },
            { name: "YouPorn", id: "youporn" }
        ];

        const endpoints = [
            { type: "random", path: "/api/{platform}/random", desc: "Vidéo aléatoire" },
            { type: "search", path: "/api/{platform}/search?q=amateur&limit=5", desc: "Recherche (amateur)" },
            { type: "stream", path: "/api/{platform}/stream/test123", desc: "Stream (test123)" },
            { type: "download", path: "/api/{platform}/download/test123", desc: "Download (test123)" }
        ];

        // Vérifier le status de l''API
        async function checkApiStatus() {
            const start = Date.now();
            try {
                const response = await fetch(API_BASE + "/health");
                const data = await response.json();
                const responseTime = Date.now() - start;
                
                const statusDot = document.getElementById("statusDot");
                const statusText = document.getElementById("statusText");
                const responseTimeEl = document.getElementById("responseTime");
                
                if (data.status === "healthy") {
                    statusDot.style.background = "#28a745";
                    statusText.textContent = "API Online ";
                } else {
                    statusDot.style.background = "#ffc107";
                    statusText.textContent = "API Issues ";
                }
                
                responseTimeEl.textContent = responseTime + "ms";
            } catch (error) {
                const statusDot = document.getElementById("statusDot");
                const statusText = document.getElementById("statusText");
                
                statusDot.style.background = "#dc3545";
                statusText.textContent = "API Offline ";
                document.getElementById("responseTime").textContent = "Error";
            }
        }

        // Afficher toast
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("show");
            
            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }

        // Copier dans le presse-papiers
        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast(" URL copiée !");
            } catch (err) {
                showToast(" Erreur de copie");
            }
        }

        // Afficher les résultats
        function showResults(data) {
            const loading = document.getElementById("loading");
            const results = document.getElementById("results");
            const resultJson = document.getElementById("resultJson");
            
            loading.classList.remove("show");
            results.style.display = "block";
            resultJson.textContent = JSON.stringify(data, null, 2);
        }

        // Masquer les résultats
        function hideResults() {
            document.getElementById("results").style.display = "none";
        }

        // Afficher le loading
        function showLoading() {
            hideResults();
            document.getElementById("loading").classList.add("show");
        }

        // Masquer le loading
        function hideLoading() {
            document.getElementById("loading").classList.remove("show");
        }

        // Tester un endpoint
        async function testEndpoint(url) {
            showLoading();
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                showResults(data);
            } catch (error) {
                showResults({ error: error.message });
            }
        }

        // Test personnalisé
        async function testCustom() {
            const platform = document.getElementById("customPlatform").value;
            const type = document.getElementById("customType").value;
            const param = document.getElementById("customParam").value;
            
            let url = API_BASE + "/api/" + platform + "/";
            
            if (type === "random") {
                url += "random";
            } else if (type === "search") {
                const query = param || "amateur";
                url += "search?q=" + encodeURIComponent(query) + "&limit=5";
            } else if (type === "stream") {
                const videoId = param || "test_" + Date.now();
                url += "stream/" + videoId;
            } else if (type === "download") {
                const videoId = param || "test_" + Date.now();
                url += "download/" + videoId;
            }
            
            await testEndpoint(url);
        }

        // Générer le HTML des plateformes
        function generatePlatformGrid() {
            const container = document.getElementById("platformGrid");
            
            container.innerHTML = platforms.map(platform => `
                <div class="platform-card">
                    <div class="platform-name">${platform.name}</div>
                    ${endpoints.map(endpoint => {
                        const url = API_BASE + endpoint.path.replace(''{platform}'', platform.id);
                        return `
                            <div class="endpoint-group">
                                <div class="endpoint-label">${endpoint.desc}</div>
                                <div class="endpoint-row">
                                    <div class="endpoint-url">${url}</div>
                                    <button class="btn btn-test" onclick="testEndpoint(''${url}'')"></button>
                                    <button class="btn btn-copy" onclick="copyToClipboard(''${url}'')"></button>
                                </div>
                            </div>
                        `;
                    }).join('''')}
                </div>
            `).join('''');
        }

        // Initialiser
        document.addEventListener("DOMContentLoaded", function() {
            generatePlatformGrid();
            checkApiStatus();
            
            // Vérifier le status toutes les 30 secondes
            setInterval(checkApiStatus, 30000);
        });
    </script>
</body>
</html>
